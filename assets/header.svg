<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <radialGradient id="glowCyan" cx="20%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowPurple" cx="80%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#334155" stroke-width="0.6" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <style>
    .title {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #f8fafc;
      letter-spacing: -0.5px;
    }
    .gradient-text {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: url(#accentGrad);
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: 'Fira Code', 'JetBrains Mono', 'Courier New', monospace;
      font-weight: 600;
      font-size: 16px;
      fill: #38bdf8;
      letter-spacing: 0.5px;
    }
    .desc {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 14.5px;
      fill: #94a3b8;
    }
    .code-text {
      font-family: 'Fira Code', 'JetBrains Mono', 'Courier New', monospace;
      font-size: 12.5px;
      fill: #e2e8f0;
    }
    .pill-text {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #e2e8f0;
    }
    .pulse {
      animation: pulseAnim 3s infinite ease-in-out;
    }
    .float {
      animation: floatAnim 5s infinite ease-in-out;
    }
    .bar1 { animation: barGrow1 3s infinite alternate ease-in-out; }
    .bar2 { animation: barGrow2 2.4s infinite alternate ease-in-out; }
    .bar3 { animation: barGrow3 3.4s infinite alternate ease-in-out; }
    @keyframes pulseAnim {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }
    @keyframes floatAnim {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes barGrow1 {
      0% { height: 22px; y: 178px; }
      100% { height: 42px; y: 158px; }
    }
    @keyframes barGrow2 {
      0% { height: 36px; y: 164px; }
      100% { height: 18px; y: 182px; }
    }
    @keyframes barGrow3 {
      0% { height: 28px; y: 172px; }
      100% { height: 48px; y: 152px; }
    }
  </style>

  <!-- Main Background -->
  <rect width="1000" height="280" rx="18" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>
  <rect width="1000" height="280" rx="18" fill="url(#grid)"/>
  <rect width="1000" height="280" rx="18" fill="url(#glowCyan)"/>
  <rect width="1000" height="280" rx="18" fill="url(#glowPurple)"/>

  <!-- Top Accent Line -->
  <rect x="40" y="0" width="920" height="3" fill="url(#accentGrad)" opacity="0.85"/>

  <!-- Left Content: Identity & Role -->
  <g transform="translate(55, 52)">
    <!-- Status Pill -->
    <rect x="0" y="0" width="250" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="16" cy="14" r="4.5" fill="#34d399" class="pulse"/>
    <text x="30" y="18" class="pill-text">Oviedo, Spain  •  @pablotome8</text>

    <!-- Main Heading -->
    <text x="0" y="74" class="title">Hi, I'm <tspan class="gradient-text">Pablo Tomé</tspan></text>

    <!-- Role Subtitle -->
    <text x="0" y="106" class="subtitle">&gt; Web Developer &amp; Data_</text>

    <!-- Short Value Proposition -->
    <text x="0" y="138" class="desc">Building web applications and working with data</text>
    <text x="0" y="158" class="desc">using Java, Spring Boot, Angular, PHP, SQL and Python.</text>

    <!-- Stack Highlight Pills -->
    <g transform="translate(0, 178)">
      <rect x="0" y="0" width="136" height="26" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.6"/>
      <text x="68" y="17" text-anchor="middle" class="pill-text" fill="#fbbf24">☕ Java / Spring Boot</text>

      <rect x="144" y="0" width="115" height="26" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1" stroke-opacity="0.6"/>
      <text x="201" y="17" text-anchor="middle" class="pill-text" fill="#f87171">🅰️ Angular / PHP</text>

      <rect x="267" y="0" width="130" height="26" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>
      <text x="332" y="17" text-anchor="middle" class="pill-text" fill="#38bdf8">🗄️ SQL / PostgreSQL</text>

      <rect x="405" y="0" width="118" height="26" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1" stroke-opacity="0.6"/>
      <text x="464" y="17" text-anchor="middle" class="pill-text" fill="#34d399">🐍 Python / Pandas</text>
    </g>
  </g>

  <!-- Right Content: Floating Terminal + Data Analytics Card -->
  <g class="float" transform="translate(600, 36)">
    <!-- Card Base -->
    <rect x="0" y="0" width="350" height="208" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>

    <!-- Window Controls -->
    <circle cx="20" cy="18" r="5.5" fill="#ef4444"/>
    <circle cx="38" cy="18" r="5.5" fill="#f59e0b"/>
    <circle cx="56" cy="18" r="5.5" fill="#10b981"/>
    <text x="175" y="22" text-anchor="middle" font-family="monospace" font-size="11" fill="#64748b">pablo@fullstack-data:~</text>
    <line x1="0" y1="34" x2="350" y2="34" stroke="#334155" stroke-width="1"/>

    <!-- Code Snippet Inside Terminal -->
    <text x="20" y="58" class="code-text"><tspan fill="#c084fc">const</tspan> <tspan fill="#38bdf8">developer</tspan> = {</text>
    <text x="36" y="78" class="code-text">name: <tspan fill="#34d399">'Pablo Tomé'</tspan>,</text>
    <text x="36" y="98" class="code-text">web: [<tspan fill="#fbbf24">'Java'</tspan>, <tspan fill="#fbbf24">'Spring Boot'</tspan>, <tspan fill="#fbbf24">'Angular'</tspan>, <tspan fill="#fbbf24">'PHP'</tspan>],</text>
    <text x="36" y="118" class="code-text">data: [<tspan fill="#38bdf8">'SQL'</tspan>, <tspan fill="#38bdf8">'PostgreSQL'</tspan>, <tspan fill="#38bdf8">'Python'</tspan>, <tspan fill="#38bdf8">'Pandas'</tspan>],</text>
    <text x="36" y="138" class="code-text">tools: [<tspan fill="#f472b6">'Docker'</tspan>, <tspan fill="#f472b6">'Git'</tspan>, <tspan fill="#f472b6">'Linux'</tspan>]</text>
    <text x="20" y="158" class="code-text">};</text>

    <!-- Mini Animated Data Bars in Bottom-Right of Terminal -->
    <rect x="268" y="178" width="10" height="22" rx="2" fill="#38bdf8" class="bar1"/>
    <rect x="284" y="164" width="10" height="36" rx="2" fill="#818cf8" class="bar2"/>
    <rect x="300" y="172" width="10" height="28" rx="2" fill="#34d399" class="bar3"/>
    <rect x="316" y="154" width="10" height="46" rx="2" fill="#38bdf8" opacity="0.85"/>
  </g>
</svg>
